sonar.projectKey=tedeuxx_tadeumendonca-io
sonar.projectName=tadeumendonca-io
sonar.organization=tedeuxx

# `scripts` is in scope (#201). It was excluded, so the blocking quality gate analysed ZERO lines of the
# build tooling — and that tooling is not incidental: routes.mjs is the single source of truth for every
# public URL, prerender.mjs produces the served HTML and its OG tags, gen-sitemap.mjs is what Google
# reads. Some of the most consequential code in the repo was the code no static analysis looked at.
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,scripts/**/*.test.mjs

# Bootstrap/provider/router wiring + build-time config + type-only files do no logic or are
# exercised by Playwright e2e (not unit) — excluded from the coverage metric (component/unit logic
# in src is unit-tested to ≥85%). Mirrors the vitest coverage.exclude in vitest.config.ts.
# gen-diagrams.mjs (#170) is a BROWSER HARNESS, not logic: it launches Chromium, injects mermaid and
# screenshots the result. Its decision logic — which fences exist, how they normalise, whether the
# committed artifact still matches — was deliberately factored into scripts/diagram-source.mjs, which IS
# unit-tested and IS in the coverage include. What remains here cannot be exercised without a browser,
# and the two things that could go wrong with it (a diagram that fails to compile, an artifact that has
# drifted) are caught by the tests on that module and by the build failing loudly. Excluded from the
# METRIC only — it stays in sonar.sources, so bugs, smells and hotspots in it are still reported.
#
# gen-og-default.mjs joins them for the same reason and by the same construction (#167): it launches
# Chromium, sets HTML and screenshots it. Its decision content — WHICH WORDS each locale's card carries,
# which file each is named, and that those words still match the hero's tagline — was factored into
# scripts/og-copy.mjs, which is unit-tested and in the include. The pattern to hold to when adding the
# next one: a generator earns this line only AFTER its decisions have been moved somewhere a test can
# reach them. Excluding one that still decides things would be buying the metric.
#
# gen-harness.mjs and check-harness-drift.mjs join on that same rule (#318, ADR-0043), and they pass it:
# every decision — what a component is, which enforcement class it may claim, whether the manifest still
# matches — lives in scripts/harness-source.mjs, which is unit-tested against fixtures and IS in the
# include. check-harness-drift.mjs has a second, harder reason: it requires a SECOND REPOSITORY on disk,
# and `npm test` must never need one. Metric only; both stay in sonar.sources.
#
# gen-video-thumbs.mjs joins on the same rule and passes it the same way: it launches Chromium, sets HTML
# and screenshots it, while every decision — which videos the content embeds, which art must exist, which
# words each card carries — lives in scripts/video-thumbs.mjs, which is unit-tested and IS in the include.
sonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/auth/amplify.ts,src/pages/CallbackPage.tsx,src/env.ts,src/test-setup.ts,src/types/**,src/vite-env.d.ts,**/*.test.ts,**/*.test.tsx,scripts/gen-diagrams.mjs,scripts/gen-og-articles.mjs,scripts/gen-og-default.mjs,scripts/gen-adrs.mjs,scripts/gen-harness.mjs,scripts/check-harness-drift.mjs,scripts/gen-video-thumbs.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# CPD (copy/paste) exclusions — owner-curated DATA registries, not duplicated logic. These are typed
# lists of same-shaped literal objects (catalog projects / repo cards); the repeated `{ name, owner,
# ... }` shape is the registry BY DESIGN (ADR-0035 defines repoCards.ts as "exactly like catalog.ts"),
# so the CPD detector's structural match is a false positive here. DRY-ing the entries would damage the
# readability of a content list to satisfy a code metric. Scoped tightly to the two list files — NOT
# src/data/** — so real logic (resolveProfile.ts) still gets CPD coverage.
sonar.cpd.exclusions=src/data/catalog.ts,src/data/repoCards.ts
