sonar.projectKey=tedeuxx_tadeumendonca-io
sonar.projectName=tadeumendonca-io
sonar.organization=tedeuxx

# `scripts` is in scope (#201). It was excluded, so the blocking quality gate analysed ZERO lines of the
# build tooling — and that tooling is not incidental: routes.mjs is the single source of truth for every
# public URL, prerender.mjs produces the served HTML and its OG tags, gen-sitemap.mjs is what Google
# reads. Some of the most consequential code in the repo was the code no static analysis looked at.
sonar.sources=src,scripts
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,scripts/**/*.test.mjs

# Bootstrap/provider/router wiring + build-time config + type-only files do no logic or are
# exercised by Playwright e2e (not unit) — excluded from the coverage metric (component/unit logic
# in src is unit-tested to ≥85%). Mirrors the vitest coverage.exclude in vitest.config.ts.
sonar.coverage.exclusions=src/main.tsx,src/App.tsx,src/auth/amplify.ts,src/pages/CallbackPage.tsx,src/env.ts,src/test-setup.ts,src/types/**,src/vite-env.d.ts,**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# CPD (copy/paste) exclusions — owner-curated DATA registries, not duplicated logic. These are typed
# lists of same-shaped literal objects (catalog projects / repo cards); the repeated `{ name, owner,
# ... }` shape is the registry BY DESIGN (ADR-0035 defines repoCards.ts as "exactly like catalog.ts"),
# so the CPD detector's structural match is a false positive here. DRY-ing the entries would damage the
# readability of a content list to satisfy a code metric. Scoped tightly to the two list files — NOT
# src/data/** — so real logic (resolveProfile.ts) still gets CPD coverage.
sonar.cpd.exclusions=src/data/catalog.ts,src/data/repoCards.ts
