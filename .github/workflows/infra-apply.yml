name: infra-apply

# Apply on merge to main → the single (staging) workspace (auto, no gate). TFC holds state (Local
# execution — GitHub runs apply); AWS via OIDC. On apply, this writes the app SSM params
# (/{env}/{frontend,storage,iam}/*) that deploy reads.
on:
  push:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/infra-apply.yml"
  # Manual trigger for cutovers / re-applies after out-of-band remediation (e.g. Lambda@Edge replica drain).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC → AWS

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}
  # Still needed: configure-aws-credentials has no node24 release, so it declares node20; this forces
  # it (and only it) onto the node24 runtime. Remove when that action ships node24 (issue #89).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: infra-apply-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: iac
    env:
      TF_WORKSPACE: tadeumendonca-io
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1 (node20 — no node24 release yet; FORCE flag covers it)
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 (node24)
        with:
          terraform_version: "1.9.8"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve -var-file=env/stg.tfvars
