name: infra-apply

# Apply on merge to main → the single (staging) workspace (auto, no gate). TFC holds state (Local
# execution — GitHub runs apply); AWS via OIDC. On apply, this writes the app SSM params
# (/{env}/{frontend,storage,iam}/*) that deploy reads.
on:
  push:
    branches: [main]
    paths:
      - "iac/**"
      - ".github/workflows/infra-apply.yml"
  # Manual trigger for cutovers / re-applies after out-of-band remediation (e.g. Lambda@Edge replica drain).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC → AWS

env:
  TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: infra-apply-staging
      cancel-in-progress: false
    defaults:
      run:
        working-directory: iac
    env:
      TF_WORKSPACE: tadeumendonca-io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        # node24-native since v6. #101 saw v6 fail OIDC ("Could not load credentials") — but only with
        # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 set, which re-forces node24 onto an already-node24 action and
        # breaks its runtime. That flag is gone now (every action here is node24), so v6 runs clean (#89).
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      # ---- Edge-assertion setup, deliberately BEFORE the apply (#237) ----
      #
      # The CloudFront Function is the one piece of `iac/` that carries application BEHAVIOUR, and
      # `apps/fed/e2e/edge-rewrite.spec.ts` is the only check that proves the edge is actually running the
      # version in the repo (#216: detached · stale association · rejected by the JS 2.0 runtime). That
      # assertion has to run AFTER whatever changes the function, which is this workflow — not `deploy`.
      #
      # Adding `iac/cloudfront-functions/**` to deploy.yml's paths was the obvious fix and is WRONG: the two
      # workflows have different concurrency groups and no ordering, so deploy's smoke would race
      # terraform apply and — given CloudFront takes minutes to propagate — almost certainly assert against
      # the PREVIOUS function and report green. That is worse than the gap it closes: a check that passes
      # having measured the state the change replaced.
      #
      # Setup sits before the apply for the reason #195 records: `--with-deps` shells out to apt, and a
      # transient mirror failure must not go red AFTER infrastructure has been mutated. If this flakes,
      # the job fails having changed nothing. The cost is that a Playwright install now gates every infra
      # apply, including ones nowhere near the edge — accepted, because the alternative is a red whose
      # meaning is ambiguous.
      - name: Setup Node (for the post-apply edge assertion)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fed/package-lock.json

      - name: Install
        # --ignore-scripts, same threat model as deploy.yml: persist-then-execute. This job holds the
        # INFRA OIDC role, which is strictly more powerful than the deploy role, so the argument is
        # stronger here, not weaker.
        working-directory: apps/fed
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        working-directory: apps/fed
        run: npx playwright install --with-deps chromium

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"

      - name: Init
        run: terraform init -input=false

      - name: Apply
        # budget_alert_email is delivered here, not via env/stg.tfvars (public repo) nor a TFC workspace
        # variable (inert under Local execution). The variable is `sensitive`, so terraform redacts it in
        # the apply output. Empty/unset secret keeps budget notifications off — the budget still tracks.
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: terraform apply -input=false -auto-approve -var-file=env/stg.tfvars

      # Two different changes, two different synchronisations — conflating them is how a wait ends up
      # guaranteeing nothing (caught in review on this very PR).
      #
      # (a) DISTRIBUTION config changes (frontend.tf) are asynchronous, and `wait_for_deployment = false`
      #     in frontend.tf means terraform does not even wait for them. So this wait is required — but it
      #     covers the SECONDARY case.
      # (b) A change to `cloudfront-functions/spa-rewrite.js` publishes a new function version and does
      #     NOT touch the distribution at all: the association is by UNQUALIFIED ARN, so the distribution
      #     never leaves `Deployed` and the wait above returns instantly. It synchronises nothing for the
      #     exact case #216/#237 exist for.
      #
      # For (b) the right check is not a wait but a COMPARISON: `publish = true` makes the publish
      # synchronous, so by the time apply returns the LIVE stage should already carry the repo's code.
      # Asserting that directly catches "stale association" and "never accepted" at their source, without
      # depending on how fast the edge propagates.
      - name: Wait for the CloudFront distribution to finish deploying
        run: |
          id="$(terraform output -raw cloudfront_distribution_id)"
          echo "waiting for distribution $id to reach Deployed…"
          aws cloudfront wait distribution-deployed --id "$id"

      - name: Verify the LIVE function stage carries the repo's code
        run: |
          name="$(terraform output -raw spa_rewrite_function_name)"
          aws cloudfront get-function --name "$name" --stage LIVE live-function.js >/dev/null
          if diff -q cloudfront-functions/spa-rewrite.js live-function.js >/dev/null; then
            echo "LIVE stage of $name matches the repo."
          else
            echo "::error::the LIVE CloudFront Function does not match iac/cloudfront-functions/spa-rewrite.js"
            diff cloudfront-functions/spa-rewrite.js live-function.js || true
            exit 1
          fi

      # Runs on EVERY infra apply, not only when cloudfront-functions/ changed. Deliberate: an edge that
      # stopped rewriting is worth catching whatever mutated it, and a filter here would be one more place
      # to keep in sync with the thing it guards — which is the defect this issue is about.
      #
      # Scoped to the edge spec alone. The full production smoke belongs to `deploy`, which owns publishing
      # the artifact; running it here would duplicate a gate and give a second workflow a reason to go red
      # for something it did not change.
      - name: Assert the edge is running the rewrite function
        working-directory: apps/fed
        env:
          E2E_ENV: production
        run: npx playwright test e2e/edge-rewrite.spec.ts --reporter=list
