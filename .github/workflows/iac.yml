name: iac

# PR gate for iac/ — named after the top-level directory it guards. (Formerly `infra-plan.yml`.)
# Trunk-based: a PR into main plans the single workspace. Terraform Cloud is the state backend (Local
# execution — GitHub runs the plan); AWS via OIDC. Workspace: tadeumendonca-io.
#
# THE CUT BETWEEN THESE JOBS IS CREDENTIALS, NOT COMMANDS:
#
#   checkov                | no init | NO AWS credentials
#   terraform fmt -check   | no init | NO AWS credentials
#   terraform validate     | init    | yes — init talks to Terraform Cloud
#   terraform plan         | init    | yes — OIDC; the plan refreshes data sources
#
# So checkov and terraform-fmt become their own jobs and that is pure gain: neither touches AWS, neither
# needs init, both fail in seconds, and both used to sit inside a job carrying `id-token: write`. Fewer
# jobs hold a credential, which is the direction the repo's least-privilege floor points.
#
# `validate` STAYS inside terraform-plan. Splitting it would run `init` twice — two provider downloads,
# two TFC round-trips — and put a credential in a second job, undoing the gain above. `plan` already
# validates; a separate job buys a clearer error message and pays for it twice.
on:
  pull_request:
    branches: [main]

# Read-only by default; the OIDC grant lives on the single job that assumes a role.
permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.9.8"

jobs:
  # Decides only. No credentials, no init, no tools.
  changes:
    runs-on: ubuntu-latest
    outputs:
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect iac changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            iac:
              # ALL of iac/, INCLUDING cloudfront-functions/. The design doc proposed excluding
              # `iac/cloudfront-functions/**` here on the grounds that it belongs to the app gate — it
              # does belong there, and it is filtered there, but excluding it HERE would be a silent
              # production no-op. iac/frontend.tf line 27 embeds the file:
              #
              #     code = file("${path.module}/cloudfront-functions/spa-rewrite.js")
              #
              # so an edit to spa-rewrite.js IS a Terraform diff. Filter it out of this gate and the
              # matching filter in deploy.yml's `terraform-apply` and the edge function is planned by
              # nothing and applied by nothing: the change merges green and never reaches the edge, with
              # no signal anywhere. The two gates make two DIFFERENT claims about the same file — `app`
              # proves the rewrite logic is correct, `iac` proves the edge is actually running it — and
              # both are required.
              - 'iac/**'
              - '.github/workflows/iac.yml'
              # deploy.yml now contains the apply, and its own paths include itself, so without this line
              # a change to the applying workflow would reach production with no plan ever reviewed —
              # while CLAUDE.md instructs "merge that touches iac/ → confirm the plan". Same defect shape
              # as #237: the gate did not cover the file that drives it.
              - '.github/workflows/deploy.yml'

  # Static analysis — hard-fail gate. Suppressions curated in iac/.checkov.yaml + inline #checkov:skip.
  checkov:
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12.3125.0
        with:
          directory: iac/
          framework: terraform
          config_file: iac/.checkov.yaml
          soft_fail: false
          output_format: cli

  terraform-fmt:
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iac
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

  # ---------------------------------------------------------------------------------------------
  # THE REQUIRED CHECK for iac PRs.
  #
  # ⚠️ RENAMED from `plan` to `terraform-plan`. Branch protection requires the JOB name `plan`, so this
  # rename does not take effect on its own — the protection must be resequenced by the owner:
  # remove `plan` from required → merge this → add `terraform-plan`. There is a window in between where
  # iac PRs are ungated. Nothing in this repo's agent loop touches branch protection.
  #
  # `if: always()` rather than a bare `needs:`, for the same two reasons as app.yml's `build-test`:
  # a skipped required check satisfies branch protection, and this job must produce a definite status
  # both when its dependencies were skipped (a non-iac PR) and when one of them failed.
  #
  # DEPENDABOT (#639): GitHub gives a Dependabot-triggered run its OWN secret store, and this repository
  # has nothing in it — `gh secret list --repo tedeuxx/tadeumendonca-io --app dependabot` returns empty, while the
  # same command with `--app actions` returns 4. So `secrets.AWS_INFRA_OIDC_ROLE_ARN` (an environment
  # secret under `staging`), `secrets.TFC_API_TOKEN` and `secrets.BUDGET_ALERT_EMAIL` are all blank on
  # such a run, and the credentials step fails with "Could not load credentials from any providers"
  # before any STS call is ever made — so this is NOT an OIDC trust or IAM problem. The runner says so
  # itself, in one line of its own log: `Secret source: Dependabot`, against `Secret source: Actions` on
  # a run triggered by anyone else. FOUR dependency PRs are confirmed dead on this and a fifth is
  # unknown, the earliest being #101 on 2026-07-24 — but THE HISTORY IS NOT MAINTAINED HERE. ADR-0014's
  # 2026-09-14 amendment is its record of authority: it carries the criterion that finds these PRs, the
  # command that evaluates it, and the per-PR evidence. This header carries the OPERATIVE RULE only,
  # because the same facts already live on three surfaces and a history maintained in three places is a
  # history that disagrees with itself. The remedy is the owner's ruling of 2026-09-11: SKIP the steps
  # that need those secrets. Adding the secrets to
  # the Dependabot store was refused on the record — it widens where an OIDC role ARN is readable —
  # and `pull_request_target` is the same security class and is refused with it.
  #
  # THE CONDITION SITS ON THE STEPS, AND THAT PLACEMENT IS THE WHOLE DESIGN:
  #   * NOT on the job — `terraform-plan` is the required check, and the line directly above says why
  #     that is fatal: a SKIPPED required check satisfies branch protection. A job-level actor test
  #     would conclude the check SKIPPED and unblock the merge with nothing having reported, which is
  #     the defect, delivered by the fix.
  #   * NOT on the `changes` filter — that filter answers *what changed*; the actor is *who*. Flipping
  #     `changes.outputs.iac` to false would also corrupt the three-case report step below and diverge
  #     from deploy.yml's parallel filter, the coupling lines 67-71 exist to protect.
  #   * The literal is repeated at six sites rather than hoisted into a second `changes` output. The
  #     hoist does not pay here: `outputs.iac` must still exist for the report step, and the two steps
  #     that do NOT simply skip — `Comment plan on PR` and `Report what was verified` — need the raw
  #     actor expression anyway to choose a BRANCH rather than to skip. A `plannable` output would
  #     therefore be a third similar name beside the literal it failed to remove. Repeating it matches
  #     app.yml:570, which carries the same predicate on `sonarqube-scan` for the same reason.
  #
  # THE RESIDUAL OF REPEATING A STRING SIX TIMES, measured rather than asserted: `actionlint` does NOT
  # catch a typo in the actor LITERAL. Mutating one site to `'dependabot'` (dropping `[bot]`) leaves the
  # pinned 1.7.12 at exit 0, while mutating `github.actor` to `github.actorr` reddens it immediately
  # with *"property not defined in object type"*. So five of six sites could silently stop matching and
  # every check would stay green — the steps would simply run and fail as they do today, which is at
  # least loud; the inverse (a site that stops SKIPPING) is the one to watch for. Nothing gates this.
  #
  # `github.secret_source` IS a real property of the `github` context — the pinned actionlint knows it,
  # which is how this residual was found — and `github.secret_source != 'Dependabot'` would name the
  # thing that is actually broken rather than a proxy for it, AND would be typo-checked by the gate.
  # It is NOT used here, on one ground and one only: `app.yml:570` already carries the actor predicate,
  # which makes it the live in-repo precedent and the calibration this change's own review rests on.
  # (An earlier draft gave a second ground — *"undocumented, so it could change with every check
  # green"* — which is FALSE, and is corrected here rather than left standing: actionlint is precisely
  # the gate that would catch a rename of that property.) Recorded as a finding for the owner.
  #
  # WHAT IS DELIBERATELY LEFT RUNNING on a Dependabot PR: the `checkov` and `terraform-fmt` jobs (no
  # credentials — both PASSED on #587), plus `Inherit the credential-free gates` and `Checkout`. A
  # dependency PR still gets a real partial gate; it does not get a plan.
  #
  # WHAT THAT COSTS, and it is narrower and sharper than "an unreviewed IaC change could merge": that
  # class is EMPTY. Dependabot cannot open a PR touching `iac/` under the current config — it declares
  # npm on /apps/fed and github-actions on /, and `iac/` holds no package*.json, no workflow and no
  # action.y*ml. What is actually lost is this repository's ONLY PR-time exercise of the OIDC credential
  # chain: `deploy.yml`'s two `configure-aws-credentials` call sites run on push to main, i.e. after the
  # merge, so `terraform-plan` is the de-facto canary for the production deploy path ON A HUMAN PR —
  # and the grouped `actions` bump moves all three call sites together. Skip the plan and an action bump
  # that breaks assume-role merges green and first fails on the trunk.
  #
  # BUT SAY WHAT IS BEING GIVEN UP EXACTLY, BECAUSE IT IS NOT A VERIFICATION: the plan has NEVER run on
  # a Dependabot PR here — every confirmed attempt died in the credential provider before any
  # AssumeRoleWithWebIdentity call. What this change surrenders is an ACCIDENTAL BLOCK (a structural red
  # that stopped the whole class, including a PR that would genuinely have broken assume-role) and not a
  # gate that was ever proving anything. Nothing is owed a replacement safeguard. ADR-0014's 2026-09-14
  # amendment carries that reasoning, the evidence and the residual nothing enforces.
  #
  # THE ROUTE TO A REAL PLAN when one is wanted: a maintainer pushes a commit to the Dependabot branch.
  # That fires `pull_request: synchronize` with a human actor and `Secret source: Actions`, so every
  # gated step runs. Cost, and it is permanent: pushing to a Dependabot branch makes Dependabot stop
  # managing that PR. The re-run button is NOT the route and this was MEASURED, not read — re-running
  # run 34519358480 as a maintainer produced attempt 2 with `Secret source: Dependabot` (2026-09-14).
  # `workflow_dispatch` is not an option either: this workflow is `on: pull_request` only, and a
  # dispatch carries no `github.event.pull_request`, so `changes`, the comment step and the required-
  # check identity all break.
  # ---------------------------------------------------------------------------------------------
  terraform-plan:
    needs: [changes, checkov, terraform-fmt]
    if: always()
    runs-on: ubuntu-latest
    # The `staging` GitHub Environment only scopes AWS_INFRA_OIDC_ROLE_ARN (an environment secret) — it
    # has no required reviewers, so it is not an approval gate.
    environment: staging
    permissions:
      contents: read
      pull-requests: write # the plan comment
      id-token: write # OIDC → AWS. The ONLY job in this file that holds a credential.
    defaults:
      run:
        working-directory: iac
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_API_TOKEN }}
      TF_WORKSPACE: tadeumendonca-io
      VAR_FILE: env/stg.tfvars
    steps:
      # First, before anything is set up: inherit the verdict of the credential-free jobs. Without this
      # the split would have made checkov and fmt advisory — they would fail, this job would run anyway,
      # and the required check would go green over a checkov violation.
      - name: Inherit the credential-free gates
        if: needs.checkov.result == 'failure' || needs.terraform-fmt.result == 'failure'
        run: |
          echo "::error::checkov or terraform fmt failed — not planning. Read those jobs."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]'
        # node24-native since v6. ~~#101 saw v6 fail OIDC ("Could not load credentials") — but only with
        # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 set~~ — the CITATION is struck 2026-09-14 (#639), not the
        # conclusion. #101's run carried that flag AND read an empty Dependabot secret store, and its
        # step shows `role-to-assume` absent from the `with:` block — a cause that alone reproduces the
        # identical failure, proved by #414/#534/#587, which carry no such flag. So the evidence is
        # CONFOUNDED and #101 cannot establish the attribution; it is the same misreading ADR-0014's
        # 2026-09-14 amendment records at two other sites. The conclusion stands on better evidence
        # anyway: the flag is gone everywhere, and v6.2.3 assumed the role cleanly on this very PR's own
        # terraform-plan run (`Secret source: Actions`, plan completed). v6 runs clean (#89).
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]'
        run: terraform init -input=false

      - name: Validate
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]'
        run: terraform validate -no-color

      # tee to a file (pipefail preserves terraform's exit code → steps.plan.outcome). The comment step
      # reads this file instead of an env var: a large plan (e.g. a 100+-resource destroy) overflows the
      # execve arg+env limit and the github-script node process fails to start with "Argument list too
      # long" BEFORE it can truncate. Reading from a file keeps the value out of the process environment.
      - name: Plan
        id: plan
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]'
        shell: bash
        # Same value as apply, so the plan preview matches what apply will do. The variable is
        # `sensitive`, so terraform renders it as "(sensitive value)" in plan.txt — which is posted as a
        # public PR comment — never the address in cleartext.
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -var-file="$VAR_FILE" 2>&1 | tee plan.txt

      # NOT gated on the actor: on a Dependabot run this step is REPURPOSED rather than skipped, and it
      # posts under the SAME marker the update logic already keys on, so it replaces rather than
      # accumulates. Its permission to post was measured rather than assumed — the failing run on #587
      # reports `Secret source: Dependabot` AND `PullRequests: write`, so the `permissions:` block above
      # is honoured on a Dependabot run and github-script can comment. Cost: one comment per Dependabot
      # PR that reaches this job, which is 5 of the 18 Dependabot PRs ever opened here.
      #
      # This is AC1's load-bearing half, because NO CHECK STATE CAN CARRY IT: a skipped job concludes
      # SKIPPED and a skipped STEP concludes SUCCESS, and both render as fine beside the other checks.
      # There is no check state meaning "ran and verified nothing". So the signal has to live in an
      # artifact a human actually reads — this comment, and the ::warning:: in the report step below.
      - name: Comment plan on PR
        if: always() && needs.changes.outputs.iac == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WORKSPACE: ${{ env.TF_WORKSPACE }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        with:
          script: |
            const fs = require("fs");
            const max = 60000;
            const planPath = "iac/plan.txt";
            const marker = "### Terraform Plan — `" + process.env.WORKSPACE + "`";
            let body;
            if (process.env.DEPENDABOT === "true") {
              // No plan exists and none could have: this run's secrets come from the Dependabot store,
              // which is empty here, so the OIDC role ARN and the TFC token are both blank. Say so
              // plainly rather than posting an empty plan block that reads like a clean diff.
              body = [
                marker,
                "Status: `not run — Dependabot-isolated secrets`",
                "",
                "**No plan was produced, and none could be.** A Dependabot-triggered run reads its secrets",
                "from a separate store (`Secret source: Dependabot`) which this repository has not populated,",
                "so `AWS_INFRA_OIDC_ROLE_ARN`, `TFC_API_TOKEN` and `BUDGET_ALERT_EMAIL` are all empty.",
                "`terraform init`, `validate` and `plan` were skipped deliberately (#639); `checkov` and",
                "`terraform fmt` DID run and their verdicts are real.",
                "",
                "**So this PR has had no Terraform plan reviewed.** If it changes an action on the OIDC path,",
                "that credential chain is unexercised until this merges and `deploy.yml` runs it on the trunk.",
                "",
                "To obtain a real plan, a maintainer pushes a commit to this branch — that fires",
                "`synchronize` with a human actor and every step runs, at the permanent cost of Dependabot no",
                "longer managing this PR. Re-running this workflow does NOT work: a re-run keeps the original",
                "actor, so the secret store stays `Dependabot` (measured 2026-09-14, run 34519358480 attempt 2).",
              ].join("\n");
            } else {
              let plan = fs.existsSync(planPath) ? fs.readFileSync(planPath, "utf8") : "(no plan output)";
              if (plan.length > max) plan = plan.slice(0, max) + "\n...(truncated — see the Actions log)";
              body = [
                marker,
                `Status: \`${process.env.PLAN_OUTCOME}\``,
                "```hcl",
                plan,
                "```",
              ].join("\n");
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if plan failed
        if: needs.changes.outputs.iac == 'true' && github.actor != 'dependabot[bot]' && steps.plan.outcome == 'failure'
        run: exit 1

      # Say which of the FOUR greens this is (issue #79 — three of them until #639). On a PR that
      # touches no iac/ this job passes in seconds having run neither checkov nor terraform — a green
      # indistinguishable from a full infra verification.
      #
      # The fourth case (#639) is the one that would otherwise LIE, which is worse than either of the
      # other two: on a Dependabot PR touching a filtered path, IAC is 'true' and job.status is 'success'
      # (skipped steps conclude SUCCESS), so without the branch below this step emitted
      # "the iac gate ran — checkov, terraform fmt, validate, plan" over a run in which validate and
      # plan never executed. A green check ASSERTING a verification that did not happen is worse than
      # a silent pass, which is why this branch ships in the same edit as the skip itself.
      #
      # ::warning:: rather than this file's usual ::notice::, deliberately: a notice is the register
      # this step uses for "here is which green this is", and this case needs the register above it.
      # It is still not a failure — the check must stay green or the PR cannot merge at all, which is
      # the whole point of the change.
      #
      # ORDER MATTERS: this branch sits BELOW the job.status test, so a Dependabot run whose checkov or
      # fmt failed still reports the failure rather than this warning.
      - name: Report what was verified
        if: always()
        env:
          IAC: ${{ needs.changes.outputs.iac }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          if [ "$IAC" != "true" ]; then
            echo "::notice::no iac/ changes — checkov, fmt, validate and plan did NOT run (nothing was verified)"
            exit 0
          fi
          if [ "${{ job.status }}" != "success" ]; then
            echo "::notice::the iac gate did NOT complete — a job or step failed, so the checks after it never ran. Read the failing one, not this line."
            exit 0
          fi
          if [ "$DEPENDABOT" = "true" ]; then
            echo "::warning::PARTIAL GATE — this is a Dependabot run. RAN: checkov, terraform fmt. DID NOT RUN: terraform init, validate, plan (Dependabot-isolated secrets — no AWS role ARN, no TFC token). NO PLAN WAS REVIEWED for this PR. A maintainer pushing a commit to this branch runs them; re-running this workflow does not. See the PR comment and ADR-0014's 2026-09-14 amendment."
            exit 0
          fi
          echo "::notice::the iac gate ran — checkov, terraform fmt, validate, plan"
