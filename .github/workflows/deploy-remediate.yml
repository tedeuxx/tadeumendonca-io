name: deploy-remediate

# A RED POST-DEPLOY SMOKE MEANS THE LIVE SITE IS BROKEN, and until now that fact lived only in a
# workflow's colour. On 2026-07-31 the smoke failed on two consecutive releases — correctly, on the
# assertion written for exactly that defect — and the site served broken OG cards for four hours,
# because a red run is a file somebody has to open. The owner already receives the Actions email; it
# arrived, twice, and did not distinguish itself from every other notification. Adding a louder
# notification would have built on a channel that is ignored by saturation, not by absence.
#
# So this does not notify. It DIAGNOSES AND PROPOSES A FIX, unattended, while nobody is looking —
# which is the scenario that actually happened.
#
# WHAT IT CANNOT DO, stated here rather than discovered: it cannot close the loop to green on its own.
# The fix for the failure that motivated it was in `iac/`, which merges only with the owner's
# ratification and applies real infrastructure. An unattended agent merging to `main` IS the
# irreversible boundary — on this repo the merge is the deploy. So the loop ends at "a PR with a
# diagnosis and a fix, waiting", never at "green". That is the honest ceiling and the owner accepted it
# when choosing this shape over an in-session rule.
#
# NO CLOUD CREDENTIAL. There is no `id-token: write` anywhere below, deliberately: this job reasons
# about a failure and writes a branch. It never deploys, applies or touches AWS. The remediation is a
# PR, and the existing gates judge it like any other.

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  contents: read

# One remediation at a time. Two red deploys in a row would otherwise put two agents on the same
# repo, racing on the same branch name.
concurrency:
  group: deploy-remediate
  cancel-in-progress: false

jobs:
  # Credential-free, agent-free decision step. Split out for the same reason `deploy` splits its own
  # gate: the job that decides whether to act must be cheap and must hold nothing.
  gate:
    # `main` only. A `workflow_dispatch` of deploy on some other ref is a person experimenting, and an
    # agent opening PRs against their experiment is noise.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - name: Is there already a remediation in flight?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # THE LOOP GUARD, and it is the reason this job exists. Merging a remediation PR bumps the
          # version, which triggers `deploy`, which — if the fix was wrong or incomplete — fails again
          # and re-enters here. Without this, one unfixable failure spends tokens until somebody
          # notices. An open remediation PR means the last proposal has not been judged yet, so a
          # second proposal has nothing new to say.
          open=$(gh pr list --repo "$REPO" --state open --label auto-remediation --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::a remediation PR is already open and unjudged — not opening a second. Nothing was diagnosed."
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::deploy failed on main with no remediation in flight — dispatching the agent."

  remediate:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut a branch and push the fix
      pull-requests: write # open the PR
      actions: read # read the FAILED run's logs — the whole input to the diagnosis
      issues: write # the PR body/labels go through the issues API
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the agent compares against tags to see what shipped

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fed/package-lock.json

      # `working-directory` is set per STEP, not per job as `deploy` does it: the agent step below must
      # run at the repo ROOT, because the cause is as often in `docs/adr/`, `CLAUDE.md` or `iac/` as it
      # is in `apps/fed` — that is exactly what the failure this workflow was written for turned out to
      # be.
      - name: Install dependencies
        working-directory: apps/fed
        # --ignore-scripts, identical to build-test and deploy (ADR-0021): the agent runs the repo's
        # gates, so it must exercise the same tree the deploy ships.
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        working-directory: apps/fed
        run: npx playwright install --with-deps chromium

      # THE LOOP GUARD IS A LABEL, so the label existing is load-bearing infrastructure, not decoration.
      # Without it two things fail together and neither is loud: `gh pr create --label` errors out, and
      # `gh pr list --label <missing>` returns an EMPTY list — so the gate above would read "no
      # remediation in flight" forever and dispatch an agent on every red deploy. Created idempotently
      # here rather than assumed, because a workflow that must work unattended cannot depend on repo
      # state somebody set up by hand once.
      - name: Ensure the loop-guard label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create auto-remediation \
            --repo "${{ github.repository }}" \
            --color B60205 \
            --description "Opened unattended by deploy-remediate after a red post-deploy run. Its presence is the loop guard." \
            --force

      - name: Diagnose the failure and propose a fix
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          # VERSION_BUMP_TOKEN, not github.token, and this is correctness rather than convenience: a PR
          # opened with GITHUB_TOKEN does NOT trigger workflows. The remediation would arrive with no
          # build-test, no Sonar, no E2E — a proposed fix for a live-site failure, carrying no evidence
          # that it does not break something else. Worse than useless, because it would LOOK reviewable.
          # This is the same reason version-main pushes the bump with this token: a GITHUB_TOKEN push
          # would never fire `deploy`.
          GH_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Merging is the deploy on this repo, so it is the irreversible boundary and this agent is
          # unattended. Denied explicitly rather than left to instruction: a prompt is guidance, a
          # disallowed tool is a floor. The `iac` apply/destroy denials are belt-and-braces — there is
          # no AWS credential in this job — but they cost nothing and they say what is intended.
          # ONE comma-separated value, not several quoted arguments: the CLI takes a single list, and a
          # shape it cannot parse is the worst outcome available here — it would drop the restriction
          # while the workflow still reads as if the floor were in place.
          claude_args: '--disallowed-tools "Bash(gh pr merge:*),Bash(git push --force:*),Bash(terraform apply:*),Bash(terraform destroy:*),Bash(aws s3 rm:*)"'
          prompt: |
            The post-deploy smoke against the LIVE site https://tadeumendonca.io just failed.
            Run ${{ github.event.workflow_run.id }} — ${{ github.event.workflow_run.html_url }}

            THE SITE IS PROBABLY BROKEN RIGHT NOW FOR REAL READERS. That is the frame: this is not a
            flaky test to re-run, it is a claim that something served to the public is wrong.

            Do this, in order.

            1. READ THE FAILURE. `gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed`.
               Identify the exact failing step. Quote it; do not summarise it.

               FIRST DECIDE WHICH KIND OF FAILURE IT IS, because most of what follows only applies to
               one of them:
                 (a) the post-deploy smoke failed an assertion → the live site is probably broken,
                     continue below;
                 (b) the build, the install or the Playwright download failed → the deploy never
                     published, so the site is UNCHANGED and nothing is broken. Say that first, in the
                     PR title, and do not imply an outage. A transient runner or apt failure is not a
                     defect to patch — #195 removed a duplicate browser install for exactly this;
                 (c) the `gate` job failed → the release range could not be computed. That is a
                     versioning/tagging problem, not a site problem.

            2. REPRODUCE IT AGAINST THE LIVE SITE, not against a local build. `curl` the URL the
               assertion is about and read what actually comes back: status AND content-type AND the
               first bytes. A 200 proves nothing on this distribution — its `custom_error_response`
               maps 403 to 200 /index.html, so a missing object is served as a healthy-looking HTML
               page. That exact trap cost four hours on 2026-07-31. If the live response looks correct
               and the test still failed, suspect the test or CDN cache lag before suspecting the site,
               and SAY SO rather than inventing a fix.

            3. FIND THE CAUSE, not the symptom. Read `CLAUDE.md` and the relevant records in
               `docs/adr/` first — this repo's failures are usually a claim in a record that stopped
               being true. Check whether the assertion that failed is the one that SHOULD have caught
               it, and whether a neighbouring assertion passed when it could not have failed.

            4. FIX IT, smallest change that addresses the cause. Run the gates you can:
               `npm --prefix apps/fed run lint`, `run typecheck`, `test`, `run e2e:local`.

            5. OPEN A PR against `main` with the label `auto-remediation`. The label is load-bearing —
               it is how the next failure knows a proposal is already waiting, so it MUST be applied.
               `gh pr create --label auto-remediation`.

            THE PR BODY MUST CONTAIN, and be honest about each:
              - the quoted failing assertion and the run link;
              - what the live site actually returned, verbatim;
              - the cause, distinguished from the symptom;
              - what you could NOT verify, explicitly. You have no AWS credential and cannot deploy,
                so you cannot prove the fix works in production — say that plainly instead of implying
                the PR closes the incident;
              - whether the fix touches `iac/`. If it does, say that merging triggers a real
                infrastructure apply and needs the owner.

            IF YOU CANNOT FIND A FIX YOU BELIEVE IN, open the PR anyway with the diagnosis and NO code
            change, titled so that is obvious. A described failure somebody can act on beats a
            confident wrong patch on a live site — and beats silence, which is what happened last time.

            Do not merge anything. Do not re-run the deploy. Do not touch `main` directly.

      - name: Say what happened, in all three cases
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The `lint-workflows` convention: a gate that matched nothing, a gate that broke, and a gate
          # that ran must not read alike. Here the third case is "the agent produced a PR" — and
          # "the agent ran and produced nothing" is a real outcome worth its own line, because it is
          # indistinguishable from success in the run's colour alone.
          pr=$(gh pr list --repo "$REPO" --state open --label auto-remediation --json number,url --jq '.[0].url // ""')
          if [ -n "$pr" ]; then
            echo "::notice::remediation proposed: $pr — it is NOT merged and the site is still broken until it is."
          else
            echo "::warning::the agent ran and opened no PR. The deploy is still red and nothing is proposed — this needs a human."
          fi
