name: deploy

# Build the SPA (Vite, static — prerendered) and publish: S3 sync with split cache headers (immutable
# hashed assets vs no-cache index.html) + CloudFront invalidation. Trunk-based: merge to main → deploy
# to the single environment (auto). AWS via OIDC (AWS_FED_OIDC_ROLE_ARN = the fed deploy role; the
# trust pins the IMMUTABLE subject repo:<org>@<org_id>/<repo>@<repo_id>:* — see iac/iam.tf, and note
# that a repo rename does not change it). Post-deploy E2E (Playwright) runs on the trunk.
on:
  push:
    branches: [main]
    paths:
      - "apps/fed/**"
      - "packages/shared/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC → AWS
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: apps/fed
    env:
      ENV_NAME: staging
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fed/package-lock.json

      - name: Install
        # --ignore-scripts: note the threat is persist-then-execute, NOT "the install holds credentials"
        # — this step runs BEFORE Configure AWS credentials below. A malicious postinstall writes into
        # node_modules, and `npm run build:static` then executes that tree with the OIDC deploy role
        # exported into the job env, i.e. with rights to write the S3 bucket and invalidate CloudFront.
        # (`id-token: write` is job-wide from step one regardless.) Nothing here needs a lifecycle hook:
        # the only dep whose install hook actually runs is esbuild, and it merely validates a binary the
        # @esbuild/<platform> optional package already delivers; the Playwright browser comes from the
        # explicit step below. Any future dep that genuinely needs a hook gets an explicit step instead.
        run: npm ci --ignore-scripts

      # Serves BOTH the prerender below and the post-deploy smoke at the end of this job — it is the only
      # browser install here (#195). `--with-deps` needs apt/root and the network, so it is deliberately
      # placed before anything is published: if this flakes, the deploy fails having changed nothing.
      - name: Install Playwright browser (for the prerender and the post-deploy smoke)
        run: npx playwright install --with-deps chromium

      - name: Configure AWS credentials (OIDC)
        # node24-native since v6. #101 saw v6 fail OIDC ("Could not load credentials") — but only with
        # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 set, which re-forces node24 onto an already-node24 action and
        # breaks its runtime. That flag is gone now (every action here is node24), so v6 runs clean (#89).
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_FED_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve config from SSM
        id: cfg
        run: |
          ssm() { aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text; }
          {
            echo "bucket=$(ssm "/$ENV_NAME/frontend/s3-bucket-name")"
            echo "distribution_id=$(ssm "/$ENV_NAME/frontend/cloudfront-distribution-id")"
          } >> "$GITHUB_OUTPUT"

      - name: Build (static — prerendered)
        # GA4 measurement id — PUBLIC (it ships in the client JS), so it lives here, not in a secret.
        # Analytics is inert without it; setting it here is what turns it on in production. GA still
        # loads only after the reader consents (src/lib/analytics), so the prerender emits no hit.
        env:
          VITE_GA_MEASUREMENT_ID: G-5W9EQN303X
        run: npm run build:static

      - name: Publish to S3 (split cache headers)
        run: |
          # Immutable hashed assets first; then the revalidating root (index.html, prerendered routes, icons)
          # with --delete to prune stale files (assets/ excluded — the first pass owns it).
          aws s3 sync dist/assets/ "s3://${{ steps.cfg.outputs.bucket }}/assets/" \
            --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ "s3://${{ steps.cfg.outputs.bucket }}/" \
            --delete --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfg.outputs.distribution_id }}" \
            --paths "/*" >/dev/null
          echo "deployed fed to $ENV_NAME"

      # Post-deploy SMOKE (Playwright E2E) against the real apex. The full regression already gated the
      # PR (build-test, against a preview) — this is the post-deploy health confirmation the principles ask
      # for: it exercises the real CDN + prerendered HTML and catches deploy/CloudFront-level breakage
      # the pre-merge run can't see. Config retries absorb invalidation lag.
      #
      # NO browser install here (#195): the step above already installed chromium in this same job, and
      # this duplicate is what turned a successful deploy red — `--with-deps` shells out to apt, and a
      # transient sync on Google's mirror failed the fetch AFTER the site had already published. This
      # smoke cannot roll anything back, so its worth rests mostly on what its RED means; a non-site
      # reason to go red erodes that, and setup is the cheapest one to remove. Environment setup belongs
      # before the deploy, not inside the assertion.
      - name: E2E smoke (Playwright) against production
        if: github.ref == 'refs/heads/main'
        env:
          E2E_ENV: ${{ env.ENV_NAME }}
        run: |
          sleep 10 # let the CloudFront invalidation propagate before driving the browser
          npm run e2e
