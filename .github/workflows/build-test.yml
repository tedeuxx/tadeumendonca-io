name: build-test

# PR gate for the site. lint + typecheck + tests (coverage ≥ 85%) + build + E2E + SonarCloud gate.
# trunk-single-env: main IS production, so there is no downstream tier to defer a check to — the full
# regression (Playwright E2E against a preview of the built app) runs HERE, before the merge deploys,
# not only post-deploy. Runs on EVERY PR to main so the required `build-test` check always reports a
# status; the dorny paths-filter skips the heavy steps when the change doesn't touch apps/fed — the job
# still finishes green, satisfying the required check. Steps run in apps/fed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/fed/**"
      - "packages/shared/**"
      - ".github/workflows/build-test.yml"
      - "iac/cloudfront-functions/**" # unit-tested here, not by infra-plan (#205)

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

# Every JS action across all workflows is now pinned to a node24 release, so FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
# is gone everywhere (removed from the three AWS workflows in #89 when configure-aws-credentials moved to
# its node24-native v6). No workflow declares it — there are no node20 actions left to force.

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fed
    steps:
      - name: Checkout
        # Full history — SonarCloud uses git blame for accurate new-code / authorship attribution.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Does this change touch apps/fed (or packages/shared), or is it unrelated? Unrelated PRs skip
      # every step below but the job still completes green, satisfying the required `build-test` check.
      - name: Detect fed changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            code:
              - 'apps/fed/**'
              - 'packages/shared/**'
              - '.github/workflows/build-test.yml'
              # The CloudFront viewer-request function is IaC by path but its behaviour is unit-tested
              # here (#205): it is what turns an advertised slash-less URL into the prerendered artifact,
              # and `infra-plan` validates Terraform, not behaviour. Without this line an edit to the
              # function alone would skip the only gate that exercises it — the test would exist and
              # never run on the change it guards.
              - 'iac/cloudfront-functions/**'

      - name: Setup Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/fed/package-lock.json

      - name: Install
        if: steps.changes.outputs.code == 'true'
        # --ignore-scripts: a PR gate installs the dependency tree of a branch anyone can open, so an
        # install hook here runs attacker-chosen code on the runner before any gate below has looked at
        # the diff. It also keeps this install identical to deploy.yml's — the gate must exercise the
        # same tree the deploy ships, or "green here" stops meaning "safe there". No dep needs a hook:
        # the only one whose install hook actually runs is esbuild, and it only validates the
        # @esbuild/<platform> binary; the Playwright browser is installed by the explicit step below.
        # (`hasInstallScript` in the lockfile also flags fsevents — stale registry metadata: the package
        # declares no install/postinstall, and it is darwin-only, so it is absent on this runner.)
        run: npm ci --ignore-scripts

      # Package-vulnerability gate (ADR-0021). Blocks the PR on HIGH/CRITICAL advisories in PRODUCTION
      # deps (audit-ci.jsonc: skip-dev + high/critical); devDep advisories surface via Dependabot but
      # never block a static-site deploy. Placed right after Install so a vulnerable dep aborts BEFORE
      # the expensive E2E + Sonar. It queries a live advisory DB, so a new advisory can start blocking an
      # otherwise-unrelated code PR — the checked-in allowlist (justification + expiry) is the relief valve.
      - name: Audit (package vulnerabilities — high/critical prod deps block)
        if: steps.changes.outputs.code == 'true'
        run: npm run audit

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Test (coverage ≥ 85%)
        if: steps.changes.outputs.code == 'true'
        run: npm test

      # Chromium is installed BEFORE the build because build:static runs scripts/prerender.mjs, which
      # launches headless chromium to snapshot each route (and now emit /cv.pdf, #140) into dist/. On a
      # fresh `npm ci` runner the browser does not exist yet, so the prerender would fail if this ran
      # after Build. E2E below reuses the same browser — this is a reorder, not a new dependency.
      - name: Install Playwright browser
        if: steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.changes.outputs.code == 'true'
        # build:static (not build) so scripts/prerender.mjs runs: it prerenders each route for OG/SEO and
        # emits the build-time /cv.pdf (#140) into dist/, which the served-/cv.pdf E2E asserts. Without it
        # dist/cv.pdf never exists in the PR gate and the new E2E would have nothing to check.
        # A TEST measurement id so the E2E can exercise the consent banner without touching the real GA
        # property — the Playwright suite blocks the googletagmanager request, so no hit ever leaves CI.
        # build:static does not inject the id the way e2e:local does, so it is set here for the build.
        env:
          VITE_GA_MEASUREMENT_ID: G-TEST00000000
        run: npm run build:static

      # `:built` skips the rebuild `e2e:local` does — the Build step above already produced dist/, and
      # a fresh checkout cannot have a stale one. Locally the default script rebuilds first, because
      # there dist/ CAN be stale and a suite run against old output passes for the wrong reason.
      - name: E2E (Playwright against a preview of the build)
        if: steps.changes.outputs.code == 'true'
        run: npm run e2e:local:built

      # Authoritative quality gate. projectBaseDir scopes the scan to apps/fed.
      # NOTE (owner/external): the SonarCloud project tedeuxx_tadeumendonca-fed must be rebound to the
      # tadeumendonca-io repo for PR decoration to work.
      # Skipped on Dependabot PRs: GitHub isolates Actions secrets from Dependabot-triggered runs, so
      # SONAR_TOKEN is empty there and the scan fails "not authorized" — blocking every dep bump for an
      # infrastructural reason, not a code one. A dep bump changes package.json/lock, not app source, so
      # Sonar's SAST/smells add little; the other gates (audit, lint, typecheck, test, build, E2E) still
      # run and gate the bump. Human PRs are unaffected.
      - name: SonarCloud scan (quality gate blocks)
        id: sonar
        if: steps.changes.outputs.code == 'true' && github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: apps/fed
          args: -Dsonar.qualitygate.wait=true

      # Say which of the two greens this is. A path-filtered job that matched nothing reports PASS
      # exactly like one that ran every gate, and that ambiguity is the second half of issue #79 —
      # it is how "build-test is green" got read as assurance it never gave on a workflow-only PR.
      #
      # LAST, and reporting Sonar's real outcome rather than a fixed list. An earlier draft sat before
      # the scan and always claimed "SonarCloud", which is untrue on a Dependabot PR (Sonar is skipped
      # there by design) and on a run where an earlier gate failed. A notice that overstates what ran
      # is the same defect it exists to remove, one level down.
      - name: Report what was verified
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.code }}" != "true" ]; then
            echo "::notice::no gated changes (apps/fed, packages/shared, iac/cloudfront-functions) — lint, typecheck, tests, build, E2E and Sonar did NOT run (nothing was verified)"
            exit 0
          fi
          # A failed step aborts the ones after it, so the full list would be a lie on this path —
          # the same overstatement this notice exists to prevent, just on the red branch instead of
          # the green one.
          if [ "${{ job.status }}" != "success" ]; then
            echo "::notice::the code gate did NOT complete — a step failed, so the checks after it never ran. Read the failing step, not this line."
            exit 0
          fi
          echo "::notice::the code gate ran — lint, typecheck, tests (coverage >=85%), build, E2E; SonarCloud: ${{ steps.sonar.outcome }}"
