# Dependency hygiene (ADR-0021). The continuous half of the package-vulnerability floor: scheduled
# update PRs + GitHub-native vulnerability alerts / security-update PRs. The *enforcement* half — a
# blocking gate that fails a PR on a high/critical prod advisory — lives in build-test.yml (audit-ci).
#
# NOTE (owner, repo Settings): Dependabot *version* updates are governed by this file, but the
# *vulnerability alerts* / security-update half is a repo toggle (Settings → Code security →
# Dependabot alerts + security updates). Enable it there — the workflow file cannot set it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/fed"
    schedule:
      interval: "weekly"
    # Keep update-PR noise low: fold minor + patch bumps into a single grouped PR.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors are a deliberate manual upgrade, not an auto-PR: a dev-tooling major often needs coordinated
    # peer bumps + testing (e.g. vite 8 needs a newer @vitejs/plugin-react + vitest, and its lockfile fails
    # `npm ci` until they move together). So Dependabot auto-proposes only minor/patch here. This governs
    # scheduled VERSION updates only — security fixes still surface via Dependabot alerts, and the audit-ci
    # gate (build-test.yml) still blocks a shipped high/critical prod vulnerability regardless.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions are now SHA-pinned (supply-chain hardening, #73). A pinned SHA never moves on its
  # own, so without this it would silently rot — miss security patches and node-runtime bumps. Dependabot
  # updates the pin AND rewrites the trailing `# vX.Y.Z` comment — but ONLY when that comment is a bare
  # version. A trailing parenthetical (`# v5.1.0 (node24)`) silently defeats the rewriter: the SHA moves,
  # the version text does not, and the pin comment starts lying (this bit us on PR #101). So pin comments
  # are kept as a bare `# vX.Y.Z`; node-runtime rationale lives in the workflow header, not per-line.
  # Majors are auto-proposed here (unlike npm): an action major is usually a small, isolated change, not
  # a coordinated peer bump, and it is CI-gated.
  #
  # ~~including on the OIDC deploy path. #101 proved this: configure-aws-credentials v6 broke our
  # assume-role and infra-plan caught it RED on the PR, before any merge.~~ STRUCK 2026-09-14 (#639) —
  # FALSE FOR DEPENDABOT'S OWN PRs, WHICH IS EVERY PR THIS BLOCK GOVERNS. It is struck rather than
  # deleted because it is the stated reason majors are admitted here at all, so a reader who takes the
  # justification at face value is taking it from this sentence.
  #
  # What changed: a Dependabot-triggered run reads its secrets from a SEPARATE store, and this
  # repository has not populated it, so iac.yml's terraform-plan could never assume the role on such a
  # PR (it failed client-side with "Could not load credentials from any providers" — the runner's own
  # log line reads `Secret source: Dependabot`). As of #639 iac.yml SKIPS those steps deliberately
  # instead of failing on them. Either way the OIDC deploy path is NOT exercised on a Dependabot PR —
  # before #639 the gate was red and blocking, after it the gate is green and silent about the plan.
  #
  # AND #101 IS NOT A NARROWER TRUTH — IT IS CASUALTY ZERO. It is a DEPENDABOT PR (`gh pr view 101
  # --json author --jq .author.login` -> app/dependabot), opened 2026-07-24 and closed unmerged 59
  # minutes later, and its failing step carries the same signature as #587: role-to-assume absent from
  # the `with:` block, TF_TOKEN_app_terraform_io empty, twelve "Could not load credentials" retries,
  # `Secret source: Dependabot`. It never exercised assume-role at all. So the struck sentence was not
  # a claim that later went stale — it was a SECRET-STORE FAILURE MISREAD AS A SUCCESSFUL SUPPLY-CHAIN
  # GATE, and that misreading is what has been justifying an entire update class here since day one.
  # The full history, the criterion that finds these PRs, and the four-confirmed-one-unknown table are
  # in ADR-0014's 2026-09-14 amendment; this file carries the rule, not the record.
  #
  # So the honest justification for admitting majors here never rested on what #101 was thought to
  # prove, and is narrower than this block claimed: an action major is small and isolated, and it is
  # gated by actionlint, checkov, terraform fmt and the app suite — but a grouped
  # `actions` bump moves configure-aws-credentials at all THREE call sites at once, and the two in
  # deploy.yml only ever execute on push to main. A break in that chain surfaces on the TRUNK now,
  # where before it surfaced NOWHERE AT ALL — the PR was red for the secret-store reason and never
  # merged, so the block was accidental rather than protective. That cost is accepted, recorded in ADR-0014's 2026-09-14 amendment, and enforced by nothing:
  # whether such a PR is merged on a skipped plan or re-authored by hand (as #414 was, as 76f3910) is a
  # judgement the owner makes per PR. So majors still flow uniformly; no per-action exceptions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
