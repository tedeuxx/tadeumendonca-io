# Dependency hygiene (ADR-0021). The continuous half of the package-vulnerability floor: scheduled
# update PRs + GitHub-native vulnerability alerts / security-update PRs. The *enforcement* half — a
# blocking gate that fails a PR on a high/critical prod advisory — lives in build-test.yml (audit-ci).
#
# NOTE (owner, repo Settings): Dependabot *version* updates are governed by this file, but the
# *vulnerability alerts* / security-update half is a repo toggle (Settings → Code security →
# Dependabot alerts + security updates). Enable it there — the workflow file cannot set it.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/fed"
    schedule:
      interval: "weekly"
    # Keep update-PR noise low: fold minor + patch bumps into a single grouped PR.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Majors are a deliberate manual upgrade, not an auto-PR: a dev-tooling major often needs coordinated
    # peer bumps + testing (e.g. vite 8 needs a newer @vitejs/plugin-react + vitest, and its lockfile fails
    # `npm ci` until they move together). So Dependabot auto-proposes only minor/patch here. This governs
    # scheduled VERSION updates only — security fixes still surface via Dependabot alerts, and the audit-ci
    # gate (build-test.yml) still blocks a shipped high/critical prod vulnerability regardless.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  # GitHub Actions are now SHA-pinned (supply-chain hardening, #73). A pinned SHA never moves on its
  # own, so without this it would silently rot — miss security patches and node-runtime bumps. Dependabot
  # updates the pin AND rewrites the trailing `# vX.Y.Z` comment — but ONLY when that comment is a bare
  # version. A trailing parenthetical (`# v5.1.0 (node24)`) silently defeats the rewriter: the SHA moves,
  # the version text does not, and the pin comment starts lying (this bit us on PR #101). So pin comments
  # are kept as a bare `# vX.Y.Z`; node-runtime rationale lives in the workflow header, not per-line.
  # Majors are auto-proposed here (unlike npm): an action major is usually a small, isolated, CI-gated
  # change, not a coordinated peer bump.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    # configure-aws-credentials is the one exception to "majors auto-flow": it is on the OIDC deploy
    # path, and its v6 (node24-native) changed credential loading in a way that breaks our assume-role
    # (every deploy/infra job failed "Could not load credentials" on PR #101). A broken bump there is
    # not a green-CI dependency bump the reviewer can merge — it takes the whole pipeline down. Adopting
    # v6 (and dropping FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 with it) is a deliberate slice, #89. Minor/patch
    # within v4 still flow, so security fixes are not blocked.
    ignore:
      - dependency-name: "aws-actions/configure-aws-credentials"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
